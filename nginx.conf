# Docker's DNS returns one address per api container; re-resolve every 5s so scaling up or down is picked up
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    client_max_body_size 300M;

    location / {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
