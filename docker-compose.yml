# docker compose up --build -d --scale api=3
# nginx on port 8080 spreads requests over all api containers
services:
  api:
    build: .
    image: pneumonia-xray-api
    environment:
      - MODELS_DIR=/app/models
      - STORAGE_DIR=/app/storage
      - TF_NUM_INTRAOP_THREADS=1   # each container gets one CPU, so one thread each
      - TF_NUM_INTEROP_THREADS=1
    volumes:
      - models:/app/models      # shared so every container serves the newest model after a retrain
      - storage:/app/storage    # uploaded images and the sqlite database
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 3G
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"   # the server uses HTTP_PORT=80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  models:
  storage:
